<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Pop ศัพท์ป๊อป</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#5b6cff;--card:#fff;--ink:#14163a;--mut:#5b5f8a;--line:#14163a;--sun:#ffd23f;--pink:#ff7ab8;--mint:#3ddc97;--bad:#ff5a4e;--on:#14163a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15173a;--card:#23266a;--ink:#f3f4ff;--mut:#a9adde;--line:#07081c}}
:root[data-theme="dark"]{--bg:#15173a;--card:#23266a;--ink:#f3f4ff;--mut:#a9adde;--line:#07081c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 Sarabun,"Noto Sans Thai",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,.d,.big,.btn,.chip{font-family:Mitr,"Noto Sans Thai",system-ui,sans-serif;font-weight:500}
h1{font-size:44px;line-height:1;margin:0;color:var(--on);-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--line);color:var(--sun)}
h2{margin:0;font-size:26px}p{margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:18px}
.btn{font-size:19px;border:3px solid var(--line);border-radius:16px;background:var(--sun);color:var(--on);padding:12px 18px;box-shadow:0 5px 0 var(--line);cursor:pointer;width:100%}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink)}.btn:disabled{opacity:.35;cursor:default}
.chip{border:3px solid var(--line);border-radius:99px;padding:2px 14px;background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}.grow{flex:1}
.bar{height:18px;border:3px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.seg,.row{display:flex;gap:10px}.seg .btn{padding:8px;font-size:18px}.seg .on{background:var(--pink)}
.lvs{gap:8px;flex-wrap:wrap}.lvs .btn{font-size:16px;padding:8px 2px;width:auto;flex:1 1 28%}
.tilt{transform:rotate(-3deg);cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;margin:6px 6px 0}
.big{font-size:clamp(34px,10vw,50px);line-height:1.15;word-break:break-word}
.pos{color:var(--mut);font-size:15px}
.dys{display:flex;justify-content:space-between}
.dy{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:14px;color:var(--ink)}
.dy.on{background:var(--mint);color:var(--on)}
.pill{color:#fff;font-size:15px}
.flip{perspective:900px;height:270px;cursor:pointer}
.in{position:relative;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.back{transform:rotateY(180deg);background:var(--pink);color:var(--on)}
.o{text-align:left;font-family:Sarabun,"Noto Sans Thai",sans-serif;font-weight:600}
.o.ok{background:var(--mint);color:var(--on)}.o.no{background:var(--bad);color:#fff}
.opts{display:flex;flex-direction:column;gap:12px}
.q{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.t{width:50px;height:54px;padding:0;font-size:24px}
.slot{width:44px;height:54px;border:3px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-family:Mitr,sans-serif;font-size:24px;background:var(--card);color:var(--ink);cursor:pointer}
.fb{border:3px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;color:var(--on)}
.fb.g{background:var(--mint)}.fb.b{background:var(--sun)}
.c{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.ms{display:flex;justify-content:space-between;gap:12px;text-align:left;width:100%;padding:4px 0;border-bottom:2px solid var(--line)}
.hint{text-align:center;color:#fff;opacity:.85;font-size:15px}
label{display:flex;gap:8px;align-items:center;color:#fff;font-size:16px}
.cf{position:fixed;top:-40px;font-size:26px;pointer-events:none;animation:fall 2.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.cf{display:none}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
let D=[];
const $=s=>document.querySelector(s),A=$('#app');
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>key(new Date());
let S={seen:{},weak:{},days:{},n:10,ph:false,lv:'B1',xp:0,today:null},G=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('wordpop1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('wordpop1',JSON.stringify(S))}catch(e){}};
const LV={A:['A1','A2'],B1:['B1'],B2:['B2'],C1:['C1'],LM:['LM'],all:['A1','A2','B1','B2','C1']};
const poolOf=()=>D.filter(w=>LV[S.lv].includes(w.c)&&(S.ph||!w.p));
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuffle=(arr,r=Math.random)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const POS={N:'คำนาม',V:'คำกริยา',Adj:'คำคุณศัพท์',Adv:'คำกริยาวิเศษณ์',Pron:'สรรพนาม','Prep/Conj':'บุพบท/สันธาน','N phrase':'วลี'};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let AC;function beep(ok){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.connect(g);g.connect(AC.destination);o.type='triangle';o.frequency.setValueAtTime(ok?523:196,t);if(ok)o.frequency.setValueAtTime(784,t+.09);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}catch(e){}}
function cf(){for(let i=0;i<26;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🎉','⭐','✨','🍀','💛'][i%5];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}}
function streak(){const d=new Date();let c=0;if(!S.days[key(d)]?.done)d.setDate(d.getDate()-1);while(S.days[key(d)]?.done){c++;d.setDate(d.getDate()-1)}return c}
function buildSet(n,seed){
  const r=rng(seed),pool=poolOf();
  let ws=shuffle(pool.filter(w=>S.weak[w.i]),r).slice(0,Math.floor(n*.3));
  const used=new Set(ws.map(w=>w.i));
  ws=ws.concat(shuffle(pool.filter(w=>!S.seen[w.i]&&!used.has(w.i)).slice(0,n*3),r).slice(0,n-ws.length));
  if(ws.length<n){ws.forEach(w=>used.add(w.i));ws=ws.concat(shuffle(pool.filter(w=>!used.has(w.i)),r).slice(0,n-ws.length))}
  return shuffle(ws,r).map(w=>w.i)
}
function getToday(){const t=S.today;if(t&&t.date===today()&&t.n===S.n&&t.ph===S.ph&&t.lv===S.lv)return t.ids;
  const ids=buildSet(S.n,Number(today().replace(/-/g,'')));S.today={date:today(),n:S.n,ph:S.ph,lv:S.lv,ids};save();return ids}
function mkQ(w){
  const types=['en2th','th2en'];if(/^[a-z]{3,9}$/.test(w.en))types.push('spell','spell');
  const t=pick(types);
  if(t==='spell'){let tiles;do tiles=shuffle([...w.en]);while(tiles.join('')===w.en&&w.en.length>2);return{w,t,tiles,ans:[]}}
  const c=shuffle(D.filter(x=>x.i!==w.i&&x.p===w.p&&x.th!==w.th&&x.en!==w.en));
  const opts=shuffle(c.filter(x=>x.pos===w.pos).concat(c.filter(x=>x.pos!==w.pos)).slice(0,3).concat(w));
  return{w,t,opts}
}
const tag=w=>POS[w.pos]?`<span class="pos">${POS[w.pos]}</span>`:'';
function home(){
  G=null;const ids=getToday(),w=D[ids[0]],done=S.days[today()]?.done,pool=poolOf(),sn=pool.filter(x=>S.seen[x.i]).length;
  let wk='';for(let k=6;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);wk+=`<div class="dy ${S.days[key(d)]?.done?'on':''}">${['อา','จ','อ','พ','พฤ','ศ','ส'][d.getDay()]}</div>`}
  A.innerHTML=`<div class="top"><span class="chip">🔥 ${streak()} วันติด</span><span class="chip">⭐ ${S.xp} XP</span></div>
  <div><h1>Word Pop</h1><p style="color:#fff;margin-top:8px">${new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'})}<br>วันนี้มี ${ids.length} คำรอคุณอยู่</p></div>
  <div class="card tilt" data-act="say" data-v="${w.i}"><div class="big">${w.en}</div><div>${w.th}</div><div class="pos">แตะเพื่อฟังเสียง 🔊</div></div>
  <div class="seg lvs">${[['A','A1–A2'],['B1','B1'],['B2','B2'],['C1','C1'],['LM','IELTS 3000'],['all','ทั้งหมด']].map(([k,t])=>`<button class="btn alt ${S.lv===k?'on':''}" data-act="lv" data-k="${k}">${t}</button>`).join('')}</div>
  <div class="seg">${[10,15,20].map(n=>`<button class="btn alt ${S.n===n?'on':''}" data-act="n" data-v="${n}">${n} คำ</button>`).join('')}</div>
  <button class="btn" data-act="${done?'startb':'start'}">${done?'วันนี้ผ่านแล้ว เล่นชุดโบนัส':'เริ่มเล่นวันนี้'}</button>
  <div class="dys">${wk}</div>
  <div><div class="bar"><i style="width:${sn/pool.length*100}%"></i></div><p class="hint" style="margin-top:6px">เรียนแล้ว ${sn} จาก ${pool.length} คำ</p></div>
  <label><input type="checkbox" data-act="ph" ${S.ph?'checked':''}>รวมวลีสั้นๆ ด้วย (เช่น my friend)</label>`
}
function start(bonus){const ids=bonus?buildSet(S.n,Date.now()):getToday();G={ids,bonus,phase:'learn',k:0,xp:0,combo:0,right:0,miss:new Set()};render();speak(D[ids[0]].en)}
function render(){({learn,quiz,result}[G.phase])()}
const head=(k,n)=>`<div class="top"><button class="chip" data-act="home" aria-label="ออก">✕</button><div class="bar grow"><i style="width:${k/n*100}%"></i></div>${G.combo>1?`<span class="chip">🔥 x${G.combo}</span>`:`<span class="chip">${Math.min(k+1,n)}/${n}</span>`}</div>`;
function learn(){
  const w=D[G.ids[G.k]],last=G.k===G.ids.length-1;
  A.innerHTML=`${head(G.k,G.ids.length)}
  <div class="flip" data-act="flip"><div class="in"><div class="face card"><div class="big">${w.en}</div>${tag(w)}<button class="chip" data-act="say" data-v="${w.i}">🔊 ฟังเสียง</button></div><div class="face card back"><div class="big">${w.th}</div><div>${w.en}</div></div></div></div>
  <p class="hint">แตะการ์ดเพื่อพลิกดูคำแปล</p>
  <div class="row"><button class="btn alt" data-act="prev" ${G.k?'':'disabled'}>ย้อนกลับ</button><button class="btn" data-act="next">${last?'ไปทำควิซ':'ถัดไป'}</button></div>`
}
function startQuiz(){G.phase='quiz';G.q=shuffle(G.ids).map(i=>mkQ(D[i]));G.k=0;G.done=false;render()}
function quiz(){
  const q=G.q[G.k],w=q.w;let body='';
  if(q.t==='spell'){
    body=`<div class="tiles">${[...w.en].map((c,j)=>`<div class="slot" data-act="un" data-v="${j}">${q.ans[j]!=null?q.tiles[q.ans[j]]:''}</div>`).join('')}</div>
    <div class="tiles">${q.tiles.map((c,j)=>`<button class="btn t" data-act="tile" data-v="${j}" ${q.ans.includes(j)||G.done?'disabled':''}>${c}</button>`).join('')}</div>`
  }else body=`<div class="opts">${q.opts.map((o,j)=>`<button class="btn alt o ${G.done?(o.i===w.i?'ok':j===G.sel?'no':''):''}" data-act="pick" data-v="${j}">${q.t==='en2th'?o.th:o.en}</button>`).join('')}</div>`;
  A.innerHTML=`${head(G.k,G.q.length)}
  <div class="card q"><div class="pos">${q.t==='en2th'?'คำนี้แปลว่าอะไร':q.t==='th2en'?'เลือกคำภาษาอังกฤษ':'เรียงตัวอักษรให้ได้คำนี้'}</div><div class="big">${q.t==='en2th'?w.en:w.th}</div>${q.t==='en2th'?`<button class="chip" data-act="say" data-v="${w.i}">🔊 ฟังเสียง</button>`:''}</div>
  ${body}
  ${G.done?`<div class="fb ${G.ok?'g':'b'}"><div class="d" style="font-size:22px">${G.ok?pick(['เยี่ยมมาก! 🎉','ใช่เลย! ✨','เก่งจัง! 🚀']):'ไม่เป็นไร จำไว้นะ 💪'}</div><div>${w.en} แปลว่า ${w.th}</div><button class="btn alt" data-act="nq">ต่อไป</button></div>`:''}`
}
function fin(ok){
  const q=G.q[G.k];G.done=true;G.ok=ok;beep(ok);
  if(ok){G.combo++;G.xp+=10+Math.min(G.combo,5)*2;if(!q.retry){G.right++;delete S.weak[q.w.i]}}
  else{G.combo=0;G.miss.add(q.w.i);S.weak[q.w.i]=1;if(!q.retry)G.q.push({...mkQ(q.w),retry:1})}
  render();speak(q.w.en)
}
function finish(){
  const acc=G.right/G.ids.length;G.acc=acc;G.ids.forEach(i=>S.seen[i]=1);S.xp+=G.xp;
  if(!G.bonus)S.days[today()]={done:true,xp:G.xp,acc};save();G.phase='result';render();if(acc>=.7)cf()
}
function result(){
  const a=G.acc,st=a>=.9?3:a>=.7?2:1,ms=[...G.miss].map(i=>D[i]);
  A.innerHTML=`<div class="card c"><div class="big">${'⭐'.repeat(st)}</div><h2>${st===3?'สุดยอดไปเลย!':st===2?'ทำได้ดีมาก!':'เก็บแต้มได้แล้ว พรุ่งนี้เก่งขึ้นอีก!'}</h2>
  <p>ตอบถูกตั้งแต่ครั้งแรก ${G.right} จาก ${G.ids.length} คำ</p><p class="d" style="font-size:24px">+${G.xp} XP</p><p>ติดต่อกัน ${streak()} วันแล้ว 🔥</p></div>
  ${ms.length?`<div class="card"><h2 style="font-size:20px;margin-bottom:8px">คำที่ควรทบทวน</h2>${ms.map(w=>`<div class="ms"><b>${w.en}</b><span>${w.th}</span></div>`).join('')}<p class="pos" style="margin-top:8px">คำเหล่านี้จะกลับมาในชุดวันถัดไป</p></div>`:''}
  <button class="btn" data-act="startb">เล่นชุดโบนัสอีกรอบ</button><button class="btn alt" data-act="home">กลับหน้าหลัก</button>`
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=+b.dataset.v;
  const q=G&&G.q&&G.q[G.k];
  const f={
    say:()=>speak(D[v].en),lv:()=>{S.lv=b.dataset.k;save();home()},n:()=>{S.n=v;save();home()},ph:()=>{S.ph=b.checked;save();home()},
    start:()=>start(false),startb:()=>start(true),home,
    flip:()=>b.classList.toggle('f'),
    prev:()=>{G.k--;render();speak(D[G.ids[G.k]].en)},
    next:()=>{if(G.k>=G.ids.length-1)startQuiz();else{G.k++;render();speak(D[G.ids[G.k]].en)}},
    pick:()=>{if(G.done)return;G.sel=v;fin(q.opts[v].i===q.w.i)},
    tile:()=>{if(G.done||q.ans.includes(v))return;q.ans.push(v);if(q.ans.length===q.w.en.length)fin(q.ans.map(j=>q.tiles[j]).join('')===q.w.en);else render()},
    un:()=>{if(!G.done&&v<q.ans.length){q.ans.splice(v,1);render()}},
    nq:()=>{G.k++;G.done=false;if(G.k>=G.q.length)finish();else render()}
  };(f[a]||(()=>{}))()
});
const INLINE=null;
const init=r=>{D=r.map((x,i)=>({i,en:x[0],pos:x[1],th:x[2],p:x[3],c:x[4]}));home()};
INLINE?init(INLINE):fetch('data/vocab.json').then(r=>r.json()).then(init).catch(()=>{A.innerHTML='<p class="hint">โหลดข้อมูลคำศัพท์ไม่สำเร็จ ลองรีเฟรชหน้านี้</p>'});
</script>
</body>
</html>
